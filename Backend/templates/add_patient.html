<!DOCTYPE html>
<html>
<head>
    <title>Add Patient</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">

    <h2>📝 Add Patient</h2>

    <div class="card form-card">

        <!-- SINGLE FORM -->
        <form method="GET">

            <!-- Specialization -->
            <div class="form-group">
                <label>Select Specialization</label>
                <select name="specialization" onchange="this.form.submit()" required>

    <option value="">Choose Specialization</option>

    <option value="Cardiology"
        {% if request.args.get('specialization') == 'Cardiology' %}selected{% endif %}>
        Cardiology
    </option>

    <option value="Dermatology"
        {% if request.args.get('specialization') == 'Dermatology' %}selected{% endif %}>
        Dermatology
    </option>

    <option value="Neurology"
        {% if request.args.get('specialization') == 'Neurology' %}selected{% endif %}>
        Neurology
    </option>

    <option value="Orthopedics"
        {% if request.args.get('specialization') == 'Orthopedics' %}selected{% endif %}>
        Orthopedics
    </option>

</select>
            </div>

        </form>

        <!-- MAIN FORM -->
        <form method="POST">

            <div class="form-group">
                <label>Name</label>
                <input type="text" name="name" placeholder="Enter Name" required>
            </div>

            <div class="form-group">
                <label>Age</label>
                <input type="number" name="age" placeholder="Enter Age" required>
            </div>

            <div class="form-group">
                <label>Problem</label>
                <input type="text" name="problem" placeholder="Enter Problem" required>
            </div>

            <div class="form-group">
                <label>Select Doctor</label>
                <select name="doctor" required>
                    <option value="">Select Doctor</option>
                    {% for d in doctors %}
                    <option value="{{ d.id }}">
                        {{ d.name }} ({{ d.specialization }})
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label>Appointment Time</label>
                <input type="text" name="time" placeholder="10AM / 2PM" required>
            </div>

            <button type="submit" class="btn full-btn">
                Book Appointment
            </button>

        </form>

    </div>

</div>

</body>
</html>
